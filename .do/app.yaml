# DigitalOcean App Platform spec — engineering spec §2.
#
# Two components from one repo: the Next.js web service and the long-running
# worker that owns the scheduler and the queue consumers.
#
# Apply with:
#   doctl apps create --spec .do/app.yaml
#   doctl apps update <app-id> --spec .do/app.yaml
#
# Staging is a second app pointed at a staging database (§2): copy this file,
# change `name`, and point DATABASE_URL at the staging cluster. DO has no
# per-deploy preview environments, so staging is a real long-lived app.
#
# Secrets are set as encrypted env vars in the DO dashboard or with
# `doctl apps update --spec`, never committed. Values below marked EV[1:...]
# are placeholders that DO replaces with its encrypted form.

name: war-room
region: nyc

databases:
  - name: war-room-db
    engine: PG
    version: "16"
    production: true
  - name: war-room-cache
    engine: VALKEY
    version: "8"
    production: true

services:
  - name: web
    github:
      repo: savankong/war-room-v2
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    run_command: npm start
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    http_port: 3000
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 30
    envs:
      # Pooled connection for the app (§2). PgBouncer in transaction mode.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${war-room-db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${war-room-cache.DATABASE_URL}
      - key: NEXT_PUBLIC_APP_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: EV[1:placeholder:jwt-secret]
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: EV[1:placeholder:anthropic-key]
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: EV[1:placeholder:stripe-secret]
      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
        value: EV[1:placeholder:stripe-webhook]
      - key: STRIPE_PRICE_ID_CAPTURE
        scope: RUN_TIME
        value: price_replace_me
      - key: SAM_SYNC_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: EV[1:placeholder:admin-token]

workers:
  - name: worker
    github:
      repo: savankong/war-room-v2
      branch: main
      deploy_on_push: true
    build_command: npm ci
    run_command: npx tsx worker/index.ts
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${war-room-db.DATABASE_URL}
      # Migrations and anything session-scoped need the direct port. Set this
      # to the cluster's non-pooled connection string.
      - key: DATABASE_URL_DIRECT
        scope: RUN_TIME
        type: SECRET
        value: EV[1:placeholder:direct-database-url]
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${war-room-cache.DATABASE_URL}
      - key: NEXT_PUBLIC_APP_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: WORKER_TIMEZONE
        scope: RUN_TIME
        value: America/New_York
      - key: SAM_GOV_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: EV[1:placeholder:sam-key]
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: EV[1:placeholder:anthropic-key]
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: EV[1:placeholder:resend-key]
      - key: BRIEFING_FROM_EMAIL
        scope: RUN_TIME
        value: War Room <briefing@warroomusa.com>
      # Leave set until the §12 gate is passed. While this is non-empty, the
      # send job mails only these addresses — an accidental blast to real
      # contractors during the manual-briefing phase is unrecoverable.
      - key: BRIEFING_ALLOWLIST
        scope: RUN_TIME
        value: ""

jobs:
  # DO App Platform Jobs are deploy-lifecycle only, not cron (§2), which is
  # exactly what a migration wants: run once, before the new code serves.
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: savankong/war-room-v2
      branch: main
    build_command: npm ci
    run_command: npm run migrate
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: DATABASE_URL_DIRECT
        scope: RUN_TIME
        type: SECRET
        value: EV[1:placeholder:direct-database-url]
